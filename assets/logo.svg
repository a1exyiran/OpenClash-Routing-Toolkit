<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OpenClash Routing Toolkit">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162238"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#2A4A7A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!-- Rounded tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#bloom)"/>
  <g clip-path="url(#tileClip)">
    <ellipse cx="256" cy="-10" rx="280" ry="160" fill="url(#glass)"/>
  </g>
  <rect x="9" y="9" width="494" height="494" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>
  <!-- Corner sparkle, echoing the glass cards in the diagrams -->
  <circle cx="412" cy="92" r="5" fill="#FFFFFF" fill-opacity="0.55"/>

  <!-- Soft glows under the two outgoing paths -->
  <path d="M236 256 C 312 256, 328 142, 424 128" fill="none" stroke="#D97757" stroke-width="46" stroke-linecap="round" stroke-opacity="0.22"/>
  <path d="M236 256 C 312 256, 328 370, 424 384" fill="none" stroke="#6BA4D8" stroke-width="46" stroke-linecap="round" stroke-opacity="0.22"/>

  <!-- Incoming trunk (neutral) -->
  <path d="M86 256 L 214 256" fill="none" stroke="#D5DEEB" stroke-width="26" stroke-linecap="round"/>

  <!-- Outgoing forks -->
  <path d="M236 256 C 312 256, 328 142, 424 128" fill="none" stroke="#D97757" stroke-width="26" stroke-linecap="round"/>
  <path d="M236 256 C 312 256, 328 370, 424 384" fill="none" stroke="#6BA4D8" stroke-width="26" stroke-linecap="round"/>

  <!-- Left source node -->
  <circle cx="86" cy="256" r="22" fill="#0B1220" stroke="#D5DEEB" stroke-width="10"/>

  <!-- Center router node -->
  <circle cx="230" cy="256" r="38" fill="#10182A" stroke="#E8EEF6" stroke-width="8"/>
  <circle cx="230" cy="256" r="14" fill="#E8EEF6"/>

  <!-- Destination nodes -->
  <circle cx="424" cy="128" r="22" fill="#D97757"/>
  <circle cx="424" cy="384" r="22" fill="#6BA4D8"/>
</svg>
