# 复制为 config.yaml 后填你自己的值。不要把填好的文件提交进 Git。
#
# scripts/claude_inject.sh 会读取 claude.node_match 与 claude.alias。
# 没有这两项，注入会拒绝执行（没有内置的默认节点名）。
# 完整安装器（install.sh --dry-run / --apply）仍为待实现。

claude:
  # 用于在订阅节点里找出要钉死的那一个。按 Ruby 正则匹配节点名，必须恰好命中 1 个。
  # 下面是中性示例，请改成你自己的节点名特征。
  node_match: "美国01"
  # 改名后的显示名，会成为 Claude专用 组的首位（默认出口）。
  # 不要使用 DIRECT、REJECT、Claude专用、ClaudeAuto、APNs推送 等保留名。
  alias: "Claude-Node"

router:
  # 目标主机如何登录，由你在本地提供；不要把密码写在这里
  host: 192.0.2.1
  user: root
  # 可选：已配置好的 SSH 私钥路径
  # ssh_key: ~/.ssh/id_ed25519_openclash

openclash:
  # 留空表示让助手在实机上探测，不要用仓库里的占位符去猜
  config_path: ""
  custom_dir: /etc/openclash/custom
  core_path: /etc/openclash/core/clash_meta

# 订阅地址不要写在本文件。指向路由器上权限已收紧的凭据文件。
credentials:
  file: /etc/openclash/custom/routing_toolkit_sub.yaml
  # 文件内容由你放置；助手只检查存在与权限，不把内容读到对话里

policy:
  # 以下均为示例名，必须改成你自己的组名和规则
  group_name: dedicated
  fallback: REJECT
  domain_suffixes:
    - example.com
  # 可选
  ip_cidrs: []
  extra_rules: []

deploy:
  allow_restart: false
  require_dry_run: true
  min_mem_available_mb: 190
